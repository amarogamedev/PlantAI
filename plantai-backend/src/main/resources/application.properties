spring.application.name=plantai

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:8b
spring.ai.ollama.chat.options.temperature=0

logging.level.org.springframework.ai=INFO
logging.level.org.springframework.web.client=INFO

# MySQL datasource - replace username/password and URL as needed
spring.datasource.url=jdbc:mysql://localhost:3306/plantai?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/db.changelog-master.xml
spring.jpa.show-sql=true
spring.sql.init.mode=never